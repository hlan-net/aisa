# aisa's chart. Nothing here names an environment: the addresses of Vault and Consul and the
# names of the Vault roles come from the values of the install.

# Shared with the proxy's chart, which reads them too.
global:
  aisa:
    # The name of aisa's objects, its Service among them. Empty: <release>, or <release>-aisa when
    # the release name does not contain "aisa". Global, because the proxy finds aisa by it.
    fullnameOverride: ""
  vault:
    # Vault's address, e.g. https://vault.vault.svc:8200. Required.
    addr: ""
  consul:
    # Consul's address, e.g. consul-server.consul.svc:8500. Required: the consumers and their
    # quota profiles are declared there, and the proxy renders its routes from its catalog.
    addr: ""

image:
  repository: ghcr.io/hlan-net/aisa
  # Empty: the chart's appVersion, which is the release tag (e.g. v0.2.0).
  tag: ""
  pullPolicy: IfNotPresent

# debug, info, warn or error.
logLevel: info

# One replica: the usage ledger deduplicates events in memory, so a second replica would count
# an event that a log sink retries to the other one twice.
replicas: 1

vault:
  # Vault's Kubernetes auth: the mount and the role bound to this chart's service account and
  # namespace. The role reads secret/aisa/consumers/* (docs/concepts/VAULT.md).
  auth:
    mount: kubernetes
    role: aisa
    # The audience of the projected service account token that aisa and its Vault Agent log in
    # with; the Vault role binds it (audience=vault). Required with kubernetes.enabled: a token of
    # the API server's default audience would let the Vault Agent use the service account's
    # rights in the Kubernetes API, which include reading Secrets in every namespace.
    audience: vault
  # Where aisa's secrets are: consumers under <kvMount>/<prefix>/consumers.
  kvMount: secret
  prefix: aisa

consul:
  # aisa's keys in Consul KV: consumers under <prefix>/consumers/, quota profiles under
  # <prefix>/quotas/.
  prefix: aisa
  # A Consul ACL token from Vault's Consul secrets engine, which a Vault Agent next to aisa
  # writes to a file in memory and renews (docs/concepts/CONSUL.md, ACLs). The agent logs in with
  # the same role as aisa. Turn it off for a Consul without ACLs.
  token:
    fromVault: true
    path: consul/creds/aisa

# Token quotas need Redis for their counters. Off: no Redis, and aisa reads no quota profiles and
# limits no consumer; it still reads the consumers' declarations from Consul, authenticates and
# keeps the books.
quotas:
  enabled: true

# Admin interface and embedded web UI (/admin). Off by default.
# WARNING: /admin/api has no internal authentication. When enabled, anyone who can reach
# the API port can create consumers, mint keys, and manage quotas. If exposed via Ingress,
# always protect it with authentication annotations (e.g. forward-auth, OIDC, oauth2-proxy).
admin:
  enabled: false
  ingress:
    enabled: false
    className: ""
    # WARNING: Empty annotations publish unauthenticated key minting to whoever reaches
    # the Ingress. Always configure an authentication proxy or forward-auth middleware here:
    annotations: {}
      # For authentication in front of the admin UI (e.g. Traefik middleware or oauth2-proxy):
      # traefik.ingress.kubernetes.io/router.middlewares: default-oauth2-proxy@kubernetescrd
    hosts:
      - host: aisa-admin.local
        paths:
          - path: /admin
            pathType: Prefix
    tls: []
    #  - secretName: aisa-admin-tls
    #    hosts:
    #      - aisa-admin.local
    # Ingress controller / auth proxy peers allowed to reach port 8080 when networkPolicy is on:
    extraFrom: []
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: kube-system

# Redis holds the hot quota counters. They are short-lived (an hour of one-minute buckets), so
# this Redis keeps nothing on disk.
redis:
  # A Redis of this chart. Off: set addr to a Redis of your own.
  enabled: true
  # host:port of an external Redis, used when enabled is false.
  addr: ""
  image:
    repository: redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 16Mi}
    limits: {memory: 64Mi, ephemeral-storage: 64Mi}

# What aisa writes to the Kubernetes API (docs/concepts/KUBERNETES_OBJECTS.md): a Secret with an
# OpenAI base URL and a key for each consumer whose declaration in Consul names a namespace and a
# Secret, and a Model object per model on offer. The chart gives aisa a ClusterRole for it:
# Secrets in every namespace (aisa changes only those with its own labels) and the Models.
kubernetes:
  enabled: true
  # The proxy's URL that applications call; empty: the proxy's Service in this release,
  # http://<release>-apisix.<namespace>.svc.cluster.local/v1. Required with apisix.enabled=false.
  proxyURL: ""
  # How often aisa compares the objects with Consul and Vault; a change of the consumers'
  # declarations is applied at once.
  resync: 30s
  keys:
    # A consumer's key is replaced at this age; "0" never replaces one for its age. A pod that
    # read the key into its environment keeps the old one until it restarts, so restart such
    # pods within the grace period (a tool such as Reloader does), or mount the Secret as a file.
    rotationInterval: 720h
    # How long a replaced key stays valid.
    rotationGrace: 168h
  models:
    # A ClusterRoleBinding that lets every service account read the Models: the catalog holds
    # nothing secret. Off: bind the ClusterRole <namespace>-<fullname>-model-reader yourself.
    readableByAllServiceAccounts: true

# The CRD of the Model objects, models.aisa.hlan.net. Installed and upgraded with the chart, and
# kept when it is uninstalled, with the objects. A CRD is cluster-wide and has one owner: in a
# second install of aisa in the same cluster, set this to false.
crds:
  install: true

# Not measured on a Raspberry Pi 4 yet (#16).
resources:
  requests: {cpu: 20m, memory: 32Mi, ephemeral-storage: 16Mi}
  limits: {memory: 128Mi, ephemeral-storage: 64Mi}

vaultAgent:
  image:
    repository: hashicorp/vault
    tag: 2.1.1
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 10m, memory: 64Mi, ephemeral-storage: 16Mi}
    limits: {memory: 128Mi, ephemeral-storage: 64Mi}

serviceAccount:
  # Empty: the chart's full name.
  name: ""

# aisa's Services are always ClusterIPs: port 8080 for the proxy (/v1/decide, and /v1/usage and
# /v1/render, which take usage events and render reports without authentication), and port 9090
# for /metrics. Neither is published outside the cluster.

# aisa's API answers only its proxy. The peers in extraFrom (NetworkPolicy "from" peers), such as
# Prometheus, reach the metrics port 9090 only, not the API: they cannot send usage events (#46).
networkPolicy:
  enabled: true
  extraFrom: []
  # e.g. Prometheus in the namespace monitoring:
  # extraFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring

# For clusters with the Prometheus Operator: scrapes aisa's own aisa_* metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Added to aisa's container, e.g. VAULT_CACERT with a CA mounted through extraVolumes, or
# AISA_CONSUMER_REFRESH.
extraEnv: []
extraVolumes: []
# Mounted into aisa and its Vault Agent.
extraVolumeMounts: []

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The proxy (proxies/apisix/chart). Its values go here; global.vault and global.consul are
# shared. See that chart's values.yaml.
apisix:
  enabled: true
