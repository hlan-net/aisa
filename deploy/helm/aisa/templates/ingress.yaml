{{- if and .Values.admin.enabled .Values.admin.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aisa.fullname" . }}-admin
  labels:
    {{- include "aisa.labels" . | nindent 4 }}
  {{- with .Values.admin.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.admin.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.admin.ingress.tls }}
  tls:
    {{- range .Values.admin.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.admin.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "aisa.fullname" $ }}
                port:
                  number: 8080
          {{- end }}
    {{- end }}
{{- end }}
