{{- $consulToken := and .Values.quotas.enabled .Values.consul.token.fromVault }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisa.fullname" . }}
  labels:
    {{- include "aisa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "aisa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aisa.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aisa.serviceAccountName" . }}
      # aisa does not talk to the Kubernetes API yet. Its service account token is projected
      # below, for Vault's Kubernetes auth only.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- if $consulToken }}
      initContainers:
        # A sidecar that starts first (restartPolicy: Always, Kubernetes 1.29+), so aisa starts
        # with a Consul token in place.
        - name: vault-agent
          image: {{ printf "%s:%s" .Values.vaultAgent.image.repository .Values.vaultAgent.image.tag | quote }}
          imagePullPolicy: {{ .Values.vaultAgent.image.pullPolicy }}
          restartPolicy: Always
          command: ["vault", "agent", "-config=/etc/aisa/vault-agent.hcl"]
          env:
            - name: VAULT_ADDR
              value: {{ include "aisa.vaultAddr" . | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            # The vault user of the official image.
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: vault-agent, mountPath: /etc/aisa, readOnly: true}
            - {name: tokens, mountPath: /vault}
            - {name: serviceaccount, mountPath: /var/run/secrets/aisa/serviceaccount, readOnly: true}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            exec: {command: ["sh", "-c", "test -s /vault/consul-token"]}
            periodSeconds: 1
            failureThreshold: 60
          resources:
            {{- toYaml .Values.vaultAgent.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: aisa
          image: {{ include "aisa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AISA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: VAULT_ADDR
              value: {{ include "aisa.vaultAddr" . | quote }}
            - name: AISA_VAULT_K8S_MOUNT
              value: {{ .Values.vault.auth.mount | quote }}
            - name: AISA_VAULT_K8S_ROLE
              value: {{ .Values.vault.auth.role | quote }}
            - name: AISA_VAULT_K8S_TOKEN_PATH
              value: /var/run/secrets/aisa/serviceaccount/token
            - name: AISA_VAULT_KV_MOUNT
              value: {{ .Values.vault.kvMount | quote }}
            - name: AISA_VAULT_PREFIX
              value: {{ .Values.vault.prefix | quote }}
            {{- if .Values.quotas.enabled }}
            - name: CONSUL_HTTP_ADDR
              value: {{ required "global.consul.addr is required: the address of Consul" .Values.global.consul.addr | quote }}
            - name: AISA_CONSUL_PREFIX
              value: {{ .Values.consul.prefix | quote }}
            {{- if $consulToken }}
            - name: CONSUL_HTTP_TOKEN_FILE
              value: /vault/consul-token
            {{- end }}
            - name: AISA_REDIS_ADDR
              value: {{ include "aisa.redisAddr" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: serviceaccount, mountPath: /var/run/secrets/aisa/serviceaccount, readOnly: true}
            {{- if $consulToken }}
            - {name: tokens, mountPath: /vault, readOnly: true}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: serviceaccount
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  {{- with .Values.vault.auth.audience }}
                  audience: {{ . | quote }}
                  {{- end }}
        {{- if $consulToken }}
        - name: vault-agent
          configMap: {name: {{ include "aisa.fullname" . }}-vault-agent}
        # In memory: the Consul token.
        - name: tokens
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
