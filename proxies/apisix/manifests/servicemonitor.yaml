# Optional, for clusters with the Prometheus Operator: scrapes the gateway's own metrics, which
# serve as the cross-check of aisa's ledger (docs/features/usage-metrics.md). Not part of the
# kustomization, because the resource kind exists only where the operator is installed:
#   kubectl apply -n aisa -f proxies/apisix/manifests/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apisix-gateway
  labels: {app.kubernetes.io/name: apisix, app.kubernetes.io/part-of: aisa}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: apisix}
  endpoints:
    - port: metrics
      path: /apisix/prometheus/metrics
      interval: 30s
