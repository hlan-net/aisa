# The APISIX proxy as plain manifests (spike S5): kubectl apply -k proxies/apisix
#
# The ConfigMaps are generated from the proxy's own files, so the cluster runs exactly what
# the integration test runs. Their names carry a hash of the content: a changed file rolls
# the pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aisa

resources:
  - manifests/proxy.yaml

configMapGenerator:
  - name: apisix-config
    files:
      - config.yaml
  - name: apisix-render
    files:
      - apisix.yaml.ctmpl
      - consul-template.hcl
      - guard.sh
      - vault-agent.hcl
  # Where the proxy finds Consul, Vault and aisa. Override these in an overlay.
  - name: apisix-env
    literals:
      - CONSUL_HTTP_ADDR=consul-server.consul.svc:8500
      - VAULT_ADDR=http://vault.vault.svc:8200
      - AISA_DECIDE_URI=http://aisa:8080/v1/decide
      - AISA_USAGE_URI=http://aisa:8080/v1/usage
