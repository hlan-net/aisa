# Spike S8: the dev config plus an internal listener on 127.0.0.1:9081 for the two-hop variant.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  node_listen:
    - 9080
    - ip: 127.0.0.1
      port: 9081
  enable_admin: false
  # Docker networks often have no IPv6; listening on [::] would then fail at startup.
  enable_ipv6: false
  # Re-resolve service names quickly: containers get new addresses when they are recreated.
  dns_resolver_valid: 1

nginx_config:
  error_log_level: warn

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
