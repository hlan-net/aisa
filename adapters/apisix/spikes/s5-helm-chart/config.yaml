# Spike S5: APISIX's config for the adapter on Kubernetes: the internal listener of the two-hop
# route (S8) and one worker (S7).
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  node_listen:
    - 9080
    - ip: 127.0.0.1
      port: 9081
  enable_admin: false
  # Docker networks often have no IPv6; listening on [::] would then fail at startup.
  enable_ipv6: false
  # Re-resolve service names quickly: containers get new addresses when they are recreated.
  dns_resolver_valid: 1

nginx_config:
  error_log_level: warn
  # One worker per core of the node otherwise, whatever the pod's CPU limit is.
  worker_processes: 1

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
