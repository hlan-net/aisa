# SonarQube analysis settings, read by .github/workflows/sonar.yml.
# The keys match what SonarQube Cloud suggests when the repository is imported.
# Remove sonar.organization when scanning against a self-hosted SonarQube Server.
sonar.organization=hlan-net
sonar.projectKey=hlan-net_aisa
sonar.projectName=aisa

sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# Clear-text HTTP (S5332) in the laptop setup: Ollama on the machine serves only HTTP, and the
# proxy is reached on localhost through a port-forward or Docker Desktop's load balancer. Nothing
# there is for a real cluster (deploy/helm/local/README.md).
sonar.issue.ignore.multicriteria=localhttp
sonar.issue.ignore.multicriteria.localhttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.localhttp.resourceKey=deploy/helm/local/**
