name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.1.0)"
        required: true
        type: string

# Each job asks for what it writes; nothing is granted to the workflow as a whole.
permissions: {}

# One release of a tag at a time, and never cancelled half way: a release that stops between
# the image and the charts leaves a version with one and not the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Before anything is published: the version is one, its commit is on main, the changelog
    # has its section, and the code vets and passes its tests. CI does not run for a commit that
    # changes only documentation, which a release preparation is, so the tests run here.
    name: Verify the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            version=$INPUT_VERSION
          else
            version=${GITHUB_REF#refs/tags/}
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a version: '$version' (want vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The commit is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; a release is cut from main"
            exit 1
          fi

      - name: The changelog has the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^## \[${VERSION#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section [${VERSION#v}]; prepare the release first"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  create-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-tag: ${{ needs.verify.outputs.release-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          VERSION: ${{ needs.verify.outputs.release-tag }}
        run: |
          # The matching section from CHANGELOG.md, which verify found to be there; the commit
          # log only if that section is empty.
          # Write to RELEASE_NOTES.md so the real CHANGELOG.md is never clobbered.
          NOTES_FILE=RELEASE_NOTES.md
          VER="${VERSION#v}"

          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              flag && /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          # Strip leading and trailing blank lines, keeping blank lines between content.
          if [ -s "$NOTES_FILE" ]; then
            awk '
              /[^[:space:]]/ { for (; pending > 0; pending--) print ""; print; started = 1; next }
              started { pending++ }
            ' "$NOTES_FILE" > "$NOTES_FILE.trimmed"
            mv "$NOTES_FILE.trimmed" "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            echo "No CHANGELOG.md section for $VER; falling back to commit log." >&2
            {
              echo "## Changes"
              echo ""
              PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
              if [ -n "$PREV_TAG" ]; then
                git log --pretty=format:"- %s" "$PREV_TAG"..HEAD
              else
                git log --pretty=format:"- %s"
              fi
            } > "$NOTES_FILE"
          fi

          echo "Release notes:"; cat "$NOTES_FILE"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.release-tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "aisa $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "aisa $TAG" --notes-file RELEASE_NOTES.md
          fi

  image:
    name: Build and push multi-arch image
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Starts running once the repository has a Dockerfile.
      # hashFiles() is only available in step conditions, not in a job-level `if`.
      - name: Set up QEMU
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.create-release.outputs.release-tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.create-release.outputs.release-tag }}
            ghcr.io/${{ github.repository }}:latest

  charts:
    name: Package and push the Helm charts
    needs: [create-release, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        env:
          HELM_VERSION: v3.22.0
        run: |
          curl -fsSL --proto =https --proto-redir =https "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" |
            sudo tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm

      - name: Package and push
        env:
          TAG: ${{ needs.create-release.outputs.release-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # Both charts carry the release: version without the "v", appVersion as the tag, which
          # is the tag of aisa's image. The proxy's chart is versioned first, so aisa's chart
          # bundles that version of it.
          VER="${TAG#v}"
          for chart in proxies/apisix/chart deploy/helm/aisa; do
            sed -i -e "s/^version: .*/version: $VER/" -e "s/^appVersion: .*/appVersion: \"$TAG\"/" "$chart/Chart.yaml"
          done
          helm dependency update deploy/helm/aisa
          helm package proxies/apisix/chart -d dist
          helm package deploy/helm/aisa -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/aisa-proxy-apisix-$VER.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push "dist/aisa-$VER.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
