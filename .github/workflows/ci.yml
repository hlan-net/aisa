name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # arm64 is a first-class target, so the tests run natively on both.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14

  image:
    # The product image builds and starts on both architectures.
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: docker build --build-arg VERSION=ci -t aisa:ci .

      - name: Start
        run: |
          # aisa reads its consumers from Vault; a dev-mode Vault without any is enough here.
          # Both start together: aisa retries until Vault answers.
          docker network create aisa-ci
          docker run -d --name vault --network aisa-ci --cap-add IPC_LOCK hashicorp/vault:2.1.1 \
            server -dev -dev-root-token-id=ci-root -dev-listen-address=0.0.0.0:8200
          docker run -d --name aisa --network aisa-ci -p 127.0.0.1:8080:8080 \
            -e VAULT_ADDR=http://vault:8200 -e VAULT_TOKEN=ci-root aisa:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Check
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/metrics | grep -F 'aisa_build_info{version="ci"} 1'
          curl -fsS http://127.0.0.1:8080/metrics | grep -F 'aisa_consumer_loads_total{result="ok"}'
          # No consumers in Vault: every key is unknown.
          [[ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer x' \
                -H 'X-Aisa-Requested-Model: m' -X POST http://127.0.0.1:8080/v1/decide)" == 401 ]]
          [[ "$(docker run --rm aisa:ci -version)" == "ci" ]]

      - name: Stop
        run: |
          docker stop aisa
          [[ "$(docker inspect aisa --format '{{.State.ExitCode}}')" == "0" ]]

      - name: Logs
        if: always()
        run: docker logs aisa || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f aisa vault || true
          docker network rm aisa-ci || true

  dev-stack:
    # End-to-end check of the dev stack: APISIX, stub aisa, mock backends, Vault, Consul, Redis.
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the dev stack
        run: docker compose -f dev/compose.yaml up -d --build --wait

      - name: Smoke test
        run: ./dev/smoke.sh

      - name: Proxy config tests
        run: |
          ./proxies/apisix/guard_test.sh
          ./proxies/apisix/render_test.sh
          ./proxies/apisix/runtime_test.sh

      - name: Logs
        if: failure()
        run: docker compose -f dev/compose.yaml logs

      - name: Stop the dev stack
        if: always()
        run: docker compose -f dev/compose.yaml down -v

  charts:
    # The charts render for the usual values and validate against the Kubernetes schemas.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        env:
          HELM_VERSION: v3.22.0
        run: |
          arch=$(dpkg --print-architecture)
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-$arch.tar.gz" |
            sudo tar xz -C /usr/local/bin --strip-components=1 "linux-$arch/helm"
          helm version --short

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" |
            sudo tar xz -C /usr/local/bin kubeconform

      - name: Lint and validate
        run: ./deploy/helm/test/charts_test.sh

  install:
    # aisa's chart with its proxy in a kind cluster, with Vault and Consul as the reference
    # environment has them (deploy/helm/test/install_test.sh).
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the images
        run: |
          docker build --build-arg VERSION=ci -t aisa:ci .
          docker build -f dev/Dockerfile -t aisa-dev-tools:ci .

      - name: Install Helm
        env:
          HELM_VERSION: v3.22.0
        run: |
          arch=$(dpkg --print-architecture)
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-$arch.tar.gz" |
            sudo tar xz -C /usr/local/bin --strip-components=1 "linux-$arch/helm"
          helm version --short

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.37.1
        run: |
          arch=$(dpkg --print-architecture)
          sudo curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/$arch/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Create a kind cluster
        env:
          KIND_VERSION: v0.33.0
        run: |
          arch=$(dpkg --print-architecture)
          sudo curl -fsSLo /usr/local/bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-$arch"
          sudo chmod +x /usr/local/bin/kind
          kind create cluster --name aisa --wait 120s
          kind load docker-image --name aisa aisa:ci aisa-dev-tools:ci

      - name: Install test
        run: ./deploy/helm/test/install_test.sh

      - name: Logs
        if: failure()
        run: |
          kubectl -n aisa get pods -o wide || true
          kubectl -n aisa logs --all-containers --prefix -l app.kubernetes.io/part-of=aisa --tail=200 || true
          kubectl -n aisa logs deploy/vault --tail=100 || true
          kubectl -n aisa get events --sort-by=.lastTimestamp | tail -50 || true
